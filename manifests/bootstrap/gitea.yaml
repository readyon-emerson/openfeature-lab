# Self-contained Gitea for the lab. ArgoCD pulls manifests from here so we
# can demo the Application / ApplicationSet flow without a real GitHub remote.
# SQLite backend, emptyDir storage, anonymous read of public repos.
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: gitea
spec:
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:1.22
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: USER_UID,                              value: "1000" }
            - { name: USER_GID,                              value: "1000" }
            - { name: GITEA__database__DB_TYPE,              value: sqlite3 }
            - { name: GITEA__database__PATH,                 value: /data/gitea/gitea.db }
            - { name: GITEA__server__DOMAIN,                 value: gitea-http.gitea.svc.cluster.local }
            - { name: GITEA__server__ROOT_URL,               value: "http://gitea-http.gitea.svc.cluster.local:3000/" }
            - { name: GITEA__server__HTTP_PORT,              value: "3000" }
            - { name: GITEA__server__DISABLE_SSH,            value: "true" }
            - { name: GITEA__security__INSTALL_LOCK,         value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION,  value: "true" }
            - { name: GITEA__log__MODE,                      value: console }
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
