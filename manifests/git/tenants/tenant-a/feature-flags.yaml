tenant: tenant-a

featureFlag:
  # Synthetic flags for sizing/stress: bulk-flag-0 .. bulk-flag-499.
  generateCount: 500

  flags:
    new-checkout-flow:
      state: ENABLED
      variants:
        'on': true
        'off': false
      defaultVariant: 'off'

    experiment-banner:
      state: ENABLED
      variants:
        control: "default banner"
        treatment: "tenant-a winning treatment"
      defaultVariant: control
      targeting:
        if:
          - "==":
              - var: userId
              - "user-1"
          - treatment
          - control
