# ApplicationSet: matrix of tenants x charts. Stamps one Application per
# (tenant, chart) pair so each tenant ends up with three Applications:
#   lab-tenant-a-feature-flags  (FeatureFlag + FeatureFlagSource + Flagd CRs)
#   lab-tenant-a-consumer       (Node.js demo, evaluates flags on a loop)
#   lab-tenant-a-loader         (Node.js load generator, idle by default)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lab-tenants
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          - list:
              elements:
                - tenant: tenant-a
                - tenant: tenant-b
          - list:
              elements:
                - chart: feature-flags
                - chart: consumer
                - chart: loader

  template:
    metadata:
      name: 'lab-{{.tenant}}-{{.chart}}'
    spec:
      project: default
      # Deployment replicas treated as user-managed. Matters for the loader
      # (./run.sh stress start/stop scales via kubectl); feature-flags has no
      # Deployment in its templates, and consumer.replicas is static at 1.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      source:
        repoURL: http://gitea-http.gitea.svc.cluster.local:3000/lab/lab-manifests.git
        targetRevision: main
        path: 'charts/{{.chart}}'
        helm:
          valueFiles:
            - '../../tenants/{{.tenant}}/{{.chart}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.tenant}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
